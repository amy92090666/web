<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨心日記</title>
    <!-- 分頁小圖示 (Favicon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
    <style>
        :root {
            --primary-color: #4C6EF5;
            --primary-gradient: linear-gradient(135deg, #3B5998 0%, #1D2B64 100%);
            --secondary-color: #3B82F6;
            --bg-color: #0A0E17;
            --card-bg: rgba(15, 23, 42, 0.85);
            --input-bg: rgba(10, 15, 30, 0.9);
            --text-color: #E2E8F0;
            --sub-text: #94A3B8;
            --border-color: rgba(59, 130, 246, 0.35);
            --glow-color: rgba(59, 130, 246, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #60a5fa, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 230px 190px, #3b82f6, rgba(0,0,0,0)),
                linear-gradient(135deg, #060913 0%, #0f172a 50%, #080d1a 100%);
            background-repeat: repeat;
            background-size: 300px 300px, 400px 400px, 250px 250px, 350px 350px, 450px 450px, 100% 100%;
            background-attachment: fixed;
            color: var(--text-color);
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
            animation: starryBlink 4s infinite alternate ease-in-out;
        }

        @keyframes starryBlink {
            0% { opacity: 0.92; }
            100% { opacity: 1; }
        }

        /* 跑馬燈樣式 */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 0;
            margin-bottom: 20px;
            box-shadow: 0 0 12px var(--glow-color);
            backdrop-filter: blur(10px);
        }

        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: marquee 15s linear infinite;
            color: #93C5FD;
            font-size: 14px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px var(--glow-color);
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        .lock-screen {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 18px var(--glow-color);
            text-align: center;
            max-width: 400px;
            margin: 80px auto;
        }

        .lock-icon {
            font-size: 56px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 12px var(--secondary-color));
        }

        .lock-screen input[type="password"] {
            width: 80%;
            padding: 12px;
            margin: 15px 0;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            box-sizing: border-box;
            outline: none;
        }

        .lock-screen input[type="password"]:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 10px var(--glow-color);
        }

        .lock-screen button {
            width: 80%;
            background: var(--primary-gradient);
            color: #FFFFFF;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--glow-color);
            transition: all 0.2s;
        }

        .main-app { display: none; }

        h1 {
            text-align: center;
            color: #60A5FA;
            margin-bottom: 30px;
            font-size: 28px;
            letter-spacing: 2px;
            text-shadow: 0 0 12px var(--glow-color), 0 0 25px rgba(59, 130, 246, 0.3);
        }

        .diary-form {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 26px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 20px rgba(30, 58, 138, 0.25);
            margin-bottom: 30px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #93C5FD;
            letter-spacing: 1px;
        }

        input[type="date"], input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
        }

        input[type="date"]:focus, input[type="text"]:focus, textarea:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 10px var(--glow-color);
        }

        .mood-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mood-btn {
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .mood-btn.selected {
            background: rgba(30, 58, 138, 0.6);
            border-color: #60A5FA;
            color: #93C5FD;
            font-weight: bold;
            box-shadow: 0 0 10px var(--glow-color);
        }

        textarea {
            height: 130px;
            resize: vertical;
            line-height: 1.6;
        }

        .submit-btn {
            width: 100%;
            background: var(--primary-gradient);
            color: #FFFFFF;
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--glow-color);
            transition: all 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--glow-color);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .lock-now-btn {
            background: var(--input-bg);
            color: var(--sub-text);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .lock-now-btn:hover {
            color: #60A5FA;
            border-color: #60A5FA;
        }

        .diary-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .diary-card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }

        .diary-card:hover {
            border-color: #60A5FA;
            box-shadow: 0 6px 24px rgba(0,0,0,0.5), 0 0 12px var(--glow-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .card-date {
            font-size: 14px;
            color: var(--sub-text);
            font-weight: 500;
        }

        .card-mood {
            font-size: 14px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            border-radius: 15px;
            color: #93C5FD;
        }

        .card-title-preview {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-color);
            margin: 10px 0;
        }

        .edited-time {
            font-size: 12px;
            color: #64748B;
            font-style: italic;
            margin-top: 4px;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
        }

        .action-group-left {
            display: flex;
            gap: 8px;
        }

        .toggle-btn, .edit-btn {
            background: rgba(30, 58, 138, 0.4);
            color: #93C5FD;
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .toggle-btn:hover, .edit-btn:hover {
            background: rgba(30, 58, 138, 0.8);
            box-shadow: 0 0 8px var(--glow-color);
        }

        .card-content {
            display: none;
            margin-top: 14px;
            padding: 14px;
            background: rgba(10, 15, 30, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            line-height: 1.7;
            white-space: pre-wrap;
            color: #CBD5E1;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 13px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }

        /* 編輯彈窗 modal 樣式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 20px;
            width: 90%;
            max-width: 550px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px var(--glow-color);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .cancel-btn {
            flex: 1;
            background: var(--input-bg);
            color: var(--sub-text);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. 密碼解鎖畫面 -->
    <div id="lock-screen" class="lock-screen">
        <div class="lock-icon">🌙</div>
        <h2 id="lock-title">日記已鎖定</h2>
        <p id="lock-desc" style="color: var(--sub-text); font-size: 14px;">請輸入密碼以進入星空空間</p>
        <input type="password" id="password-input" placeholder="輸入密碼" onkeypress="handleKeyPress(event)">
        <br>
        <button id="lock-btn" onclick="checkPassword()">解鎖日記</button>
    </div>

    <!-- 2. 日記主要畫面 -->
    <div id="main-app" class="main-app">
        
        <!-- 星空跑馬燈區塊 -->
        <div class="marquee-container">
            <div class="marquee-text">🌃無論身在何處，抬頭仰望都是同一片星空🌌</div>
        </div>

        <div class="top-bar">
            <h1>🌙 星空心情日記</h1>
            <button class="lock-now-btn" onclick="lockApp()">🔒 上鎖</button>
        </div>

        <!-- 日記新增表單 -->
        <div class="diary-form">
            <div class="form-group">
                <label for="diary-date">📅 選擇日期</label>
                <input type="date" id="diary-date">
            </div>

            <div class="form-group">
                <label>✨ 今天的心情</label>
                <div class="mood-options" id="mood-options">
                    <button type="button" class="mood-btn selected" data-mood="😊 快樂">😊 快樂</button>
                    <button type="button" class="mood-btn" data-mood="😍 喜歡">😍 喜歡</button>
                    <button type="button" class="mood-btn" data-mood="🥰 幸福">🥰 幸福</button>
                    <button type="button" class="mood-btn" data-mood="😌 平靜">😌 平靜</button>
                    <button type="button" class="mood-btn" data-mood="🫠 放鬆">🫠 放鬆</button>
                    <button type="button" class="mood-btn" data-mood="🤩 興奮">🤩 興奮</button>
                    <button type="button" class="mood-btn" data-mood="😎 自信">😎 自信</button>
                    <button type="button" class="mood-btn" data-mood="🥺 感動">🥺 感動</button>
                    <button type="button" class="mood-btn" data-mood="🩹 治癒">🩹 治癒</button>
                    <button type="button" class="mood-btn" data-mood="🤔 思考">🤔 思考</button>
                    <button type="button" class="mood-btn" data-mood="🥱 疲累">🥱 疲累</button>
                    <button type="button" class="mood-btn" data-mood="😰 焦慮">😰 焦慮</button>
                    <button type="button" class="mood-btn" data-mood="😢 難過">😢 難過</button>
                    <button type="button" class="mood-btn" data-mood="😡 生氣">😡 生氣</button>
                    <button type="button" class="mood-btn" data-mood="🤯 崩潰">🤯 崩潰</button>
                    <button type="button" class="mood-btn" data-mood="🌌 寂寞">🌌 寂寞</button>
                    <button type="button" class="mood-btn" data-mood="✨ 期待">✨ 期待</button>
                </div>
            </div>

            <div class="form-group">
                <label for="diary-title">📌 日記標題</label>
                <input type="text" id="diary-title" placeholder="給今天下個簡短的標題吧...">
            </div>

            <div class="form-group">
                <label for="diary-content">✍️ 日記內文</label>
                <textarea id="diary-content" placeholder="今天發生了什麼事？寫下來吧..."></textarea>
            </div>

            <button type="button" class="submit-btn" onclick="saveDiary()">🌟 儲存日記</button>
        </div>

        <!-- 歷史日記列表 -->
        <div class="diary-list" id="diary-list"></div>
    </div>

    <!-- 3. 編輯日記彈窗 Modal -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="color: #60A5FA; margin-top: 0;">✏️ 編輯日記</h2>
            <input type="hidden" id="edit-id">
            <div class="form-group">
                <label>📅 日期</label>
                <input type="date" id="edit-date">
            </div>
            <div class="form-group">
                <label>✨ 心情</label>
                <div class="mood-options" id="edit-mood-options">
                    <button type="button" class="mood-btn" data-mood="😊 快樂">😊 快樂</button>
                    <button type="button" class="mood-btn" data-mood="😍 喜歡">😍 喜歡</button>
                    <button type="button" class="mood-btn" data-mood="🥰 幸福">🥰 幸福</button>
                    <button type="button" class="mood-btn" data-mood="😌 平靜">😌 平靜</button>
                    <button type="button" class="mood-btn" data-mood="🫠 放鬆">🫠 放鬆</button>
                    <button type="button" class="mood-btn" data-mood="🤩 興奮">🤩 興奮</button>
                    <button type="button" class="mood-btn" data-mood="😎 自信">😎 自信</button>
                    <button type="button" class="mood-btn" data-mood="🥺 感動">🥺 感動</button>
                    <button type="button" class="mood-btn" data-mood="🩹 治癒">🩹 治癒</button>
                    <button type="button" class="mood-btn" data-mood="🤔 思考">🤔 思考</button>
                    <button type="button" class="mood-btn" data-mood="🥱 疲累">🥱 疲累</button>
                    <button type="button" class="mood-btn" data-mood="😰 焦慮">😰 焦慮</button>
                    <button type="button" class="mood-btn" data-mood="😢 難過">😢 難過</button>
                    <button type="button" class="mood-btn" data-mood="😡 生氣">😡 生氣</button>
                    <button type="button" class="mood-btn" data-mood="🤯 崩潰">🤯 崩潰</button>
                    <button type="button" class="mood-btn" data-mood="🌌 寂寞">🌌 寂寞</button>
                    <button type="button" class="mood-btn" data-mood="✨ 期待">✨ 期待</button>
                </div>
            </div>
            <div class="form-group">
                <label>📌 標題</label>
                <input type="text" id="edit-title">
            </div>
            <div class="form-group">
                <label>✍️ 內文</label>
                <textarea id="edit-content"></textarea>
            </div>
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeEditModal()">取消</button>
                <button class="submit-btn" style="flex: 1;" onclick="updateDiary()">更新儲存</button>
            </div>
        </div>
    </div>

    <script>
        let selectedMood = '😊 快樂';
        let editSelectedMood = '😊 快樂';

        function initAuth() {
            const savedPassword = localStorage.getItem('diary_password');
            const lockTitle = document.getElementById('lock-title');
            const lockDesc = document.getElementById('lock-desc');
            const lockBtn = document.getElementById('lock-btn');

            if (!savedPassword) {
                lockTitle.innerText = '首次使用設定';
                lockDesc.innerText = '請設定你的私人星空日記密碼';
                lockBtn.innerText = '設定密碼並進入';
            } else {
                lockTitle.innerText = '日記已鎖定';
                lockDesc.innerText = '請輸入密碼以進入星空空間';
                lockBtn.innerText = '解鎖日記';
            }
        }

        function checkPassword() {
            const input = document.getElementById('password-input').value;
            const savedPassword = localStorage.getItem('diary_password');

            if (!input) { alert('請輸入密碼！'); return; }

            if (!savedPassword) {
                localStorage.setItem('diary_password', input);
                alert('密碼設定成功！請妥善保存。');
                unlockApp();
            } else if (input === savedPassword) {
                unlockApp();
            } else {
                alert('密碼錯誤！');
                document.getElementById('password-input').value = '';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') checkPassword();
        }

        function unlockApp() {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('password-input').value = '';
            loadDiaries();
        }

        function lockApp() {
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('lock-screen').style.display = 'block';
            initAuth();
        }

        document.getElementById('diary-date').valueAsDate = new Date();

        // 綁定主表單心情按鈕
        const moodBtns = document.querySelectorAll('#mood-options .mood-btn');
        moodBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                moodBtns.forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                selectedMood = this.getAttribute('data-mood');
            });
        });

        // 綁定編輯視窗心情按鈕
        const editMoodBtns = document.querySelectorAll('#edit-mood-options .mood-btn');
        editMoodBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                editMoodBtns.forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                editSelectedMood = this.getAttribute('data-mood');
            });
        });

        function loadDiaries() {
            const listContainer = document.getElementById('diary-list');
            const diaries = JSON.parse(localStorage.getItem('my_mood_diaries') || '[]');
            
            listContainer.innerHTML = '';

            if (diaries.length === 0) {
                listContainer.innerHTML = '<p style="text-align: center; color: var(--sub-text);">目前還沒有日記，寫下第一篇吧！</p>';
                return;
            }

            diaries.sort((a, b) => new Date(b.date) - new Date(a.date));

            diaries.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'diary-card';
                const displayTitle = item.title ? escapeHtml(item.title) : '無標題';
                const editedTag = item.updatedAt ? `<div class="edited-time">✏️ 修改於 ${item.updatedAt}</div>` : '';

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-date">📅 ${item.date}</span>
                        <span class="card-mood">${item.mood}</span>
                    </div>
                    <div class="card-title-preview">📌 ${displayTitle}</div>
                    ${editedTag}
                    <div class="card-actions">
                        <div class="action-group-left">
                            <button class="toggle-btn" onclick="toggleContent(${item.id})">👁️ 顯示內文</button>
                            <button class="edit-btn" onclick="openEditModal(${item.id})">✏️ 編輯</button>
                        </div>
                        <button class="delete-btn" onclick="deleteDiary(${item.id})">刪除日記</button>
                    </div>
                    <div class="card-content" id="content-${item.id}">${escapeHtml(item.content)}</div>
                `;
                listContainer.appendChild(card);
            });
        }

        function toggleContent(id) {
            const contentDiv = document.getElementById(`content-${id}`);
            const btn = event.target;

            if (contentDiv.style.display === 'block') {
                contentDiv.style.display = 'none';
                btn.innerText = '👁️ 顯示內文';
            } else {
                contentDiv.style.display = 'block';
                btn.innerText = '🙈 隱藏內文';
            }
        }

        function saveDiary() {
            const date = document.getElementById('diary-date').value;
            const title = document.getElementById('diary-title').value.trim();
            const content = document.getElementById('diary-content').value.trim();

            if (!date) { alert('請選擇日期！'); return; }
            if (!title) { alert('請輸入日記標題！'); return; }
            if (!content) { alert('請輸入日記內文！'); return; }

            const diaries = JSON.parse(localStorage.getItem('my_mood_diaries') || '[]');
            diaries.push({
                id: Date.now(),
                date: date,
                mood: selectedMood,
                title: title,
                content: content
            });

            localStorage.setItem('my_mood_diaries', JSON.stringify(diaries));
            document.getElementById('diary-title').value = '';
            document.getElementById('diary-content').value = '';
            loadDiaries();
        }

        function openEditModal(id) {
            const diaries = JSON.parse(localStorage.getItem('my_mood_diaries') || '[]');
            const target = diaries.find(item => item.id === id);
            if (!target) return;

            document.getElementById('edit-id').value = target.id;
            document.getElementById('edit-date').value = target.date;
            document.getElementById('edit-title').value = target.title;
            document.getElementById('edit-content').value = target.content;

            editSelectedMood = target.mood;
            editMoodBtns.forEach(b => {
                if (b.getAttribute('data-mood') === target.mood) {
                    b.classList.add('selected');
                } else {
                    b.classList.remove('selected');
                }
            });

            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
        }

        function updateDiary() {
            const id = parseInt(document.getElementById('edit-id').value);
            const date = document.getElementById('edit-date').value;
            const title = document.getElementById('edit-title').value.trim();
            const content = document.getElementById('edit-content').value.trim();

            if (!date || !title || !content) { alert('請完整填寫欄位！'); return; }

            let diaries = JSON.parse(localStorage.getItem('my_mood_diaries') || '[]');
            const index = diaries.findIndex(item => item.id === id);

            if (index !== -1) {
                const now = new Date();
                const nowFormatted = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                diaries[index] = {
                    ...diaries[index],
                    date: date,
                    mood: editSelectedMood,
                    title: title,
                    content: content,
                    updatedAt: nowFormatted
                };

                localStorage.setItem('my_mood_diaries', JSON.stringify(diaries));
                closeEditModal();
                loadDiaries();
            }
        }

        function deleteDiary(id) {
            if (confirm('確定要刪除這篇日記嗎？')) {
                let diaries = JSON.parse(localStorage.getItem('my_mood_diaries') || '[]');
                diaries = diaries.filter(item => item.id !== id);
                localStorage.setItem('my_mood_diaries', JSON.stringify(diaries));
                loadDiaries();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        initAuth();
    </script>
</body>
</html>
